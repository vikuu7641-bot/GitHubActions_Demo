name: Playwright Automation Tests

on:

  # Run automatically when code is pushed
  push:
    branches:
      - main
      - develop

  # Run when Pull Request is created
  pull_request:
    branches:
      - main

  # Manual execution from GitHub Actions UI
  workflow_dispatch:
    inputs:

      test_type:
        description: "Select Test Type"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression

      environment:
        description: "Select Environment"
        required: true
        default: qa
        type: choice
        options:
          - qa
          - staging
          - production

  # Scheduled execution
  schedule:
    # Every day at 02:00 UTC
    - cron: "0 2 * * *"


# Global environment variables
env:
  CI: true
  NODE_VERSION: 20


jobs:

  # =====================================================
  # SMOKE TEST
  # =====================================================

  smoke-test:

    name: Smoke Tests

    # GitHub Environment
    environment:
      name: ${{ github.event.inputs.environment || 'qa' }}

    runs-on: ubuntu-latest

    # Run smoke test for:
    # Manual smoke selection
    # OR push
    # OR pull request
    # OR scheduled execution

    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.test_type == 'smoke'

    steps:

      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4


      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      # Install dependencies
      - name: Install Dependencies
        run: npm ci


      # Install Playwright browsers
      - name: Install Playwright
        run: npx playwright install --with-deps chromium


      # Run Smoke Tests
      - name: Run Smoke Tests
        run: npx playwright test --grep "@smoke"
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          USERNAME: ${{ secrets.TEST_USERNAME }}
          PASSWORD: ${{ secrets.TEST_PASSWORD }}


      # Upload HTML Report
      - name: Upload Smoke Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 30


      # Upload screenshots/videos
      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 30


  # =====================================================
  # REGRESSION TEST
  # =====================================================

  regression-test:

    name: Regression Tests

    environment:
      name: ${{ github.event.inputs.environment || 'qa' }}

    runs-on: ubuntu-latest

    # Run regression only when:
    # Manual regression is selected
    # OR scheduled execution
    # OR push to main

    if: >
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.test_type == 'regression')
      ||
      github.event_name == 'schedule'
      ||
      github.event_name == 'push'

    steps:

      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4


      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm


      # Install dependencies
      - name: Install Dependencies
        run: npm ci


      # Install Playwright
      - name: Install Playwright
        run: npx playwright install --with-deps chromium


      # Run Regression Tests
      - name: Run Regression Tests
        run: npx playwright test --grep "@regression"
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          USERNAME: ${{ secrets.TEST_USERNAME }}
          PASSWORD: ${{ secrets.TEST_PASSWORD }}


      # Upload HTML Report
      - name: Upload Regression Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-report
          path: playwright-report/
          retention-days: 30


      # Upload screenshots/videos/traces
      - name: Upload Regression Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results
          path: test-results/
          retention-days: 30